plugins {
	id 'idea'
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.springframework.cloud.contract' version '5.0.3'
}

group = 'com.fonseca.algashop'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

configurations {
	mockitoAgent
}

idea {
	module {
		downloadJavadoc = true
		downloadSources = true
	}
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
	set('springCloudVersion', "2025.1.2")
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.session:spring-session-jdbc'

	implementation 'org.apache.commons:commons-lang3:3.20.0'
	implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation("org.testcontainers:testcontainers-junit-jupiter")
	testImplementation("org.testcontainers:testcontainers-postgresql")
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server-test'
	testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'

	constraints {
		testImplementation('io.rest-assured:rest-assured:6.0.1') {
			version {
				strictly '6.0.1'
			}
		}
		testImplementation('io.rest-assured:spring-mock-mvc:6.0.1') {
			version {
				strictly '6.0.1'
			}
		}
	}
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'

	mockitoAgent('org.mockito:mockito-core:5.21.0') { transitive = false }
}

contracts {
	packageWithBaseClasses = "com.fonseca.algashop.authorizationserver.contract.base"
}

tasks.named('contractTest') {
	useJUnitPlatform()
}

tasks.named('test') {
	useJUnitPlatform()
}

def mockitoJvmArgs = [
	"-javaagent:${configurations.mockitoAgent.asPath}",
	"-Xshare:off" // Desabilita Class Data Sharing para evitar warning de bootstrap classpath
]

test {
	filter {
		excludeTestsMatching("*IT")
	}
	jvmArgs += mockitoJvmArgs
}

tasks.named('check') {
	dependsOn(test, contractTest, integrationTest)
}

tasks.register('integrationTest', Test) {
	description = 'Run integrationTest.'
	group = 'verification'
	jvmArgs += mockitoJvmArgs
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter test
	useJUnitPlatform()
	testLogging {
		events('passed')
	}

	filter {
		includeTestsMatching "*IT"
		excludeTestsMatching "*Test"
	}
}

bootJar {
	archiveFileName = 'authorization-server.jar'
}

tasks.register('dockerBuild', Exec) {
	description = 'Builds a multi-platform Docker image using Buildx'
	group = 'build'
	dependsOn('bootJar')
	workingDir project.rootDir
	commandLine 'docker', 'buildx', 'build', '--platform', 'linux/arm64/v8,linux/amd64',
		'--tag', 'algashop/authorization-server:dev', '.'
}
